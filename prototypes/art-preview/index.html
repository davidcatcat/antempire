<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美術資產預覽（PR A）</title>
<style>
  :root { --bg: #1d1712; --panel: #2a221b; --ink: #f1e6d4; --muted: #b9a88f; --accent: #e3b46b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  header { padding: 14px 16px 6px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 6px; color: var(--accent); }
  p.note { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 9px; background: #5a3b1b; color: #ffe6bf; font-size: 12px; margin-right: 6px; }
  section { margin: 10px 16px 18px; padding: 12px; background: var(--panel); border-radius: 10px; overflow: hidden; }
  canvas { display: block; max-width: 100%; border-radius: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>《螞蟻帝國》美術資產預覽（PR A：只有資產）</h1>
  <p class="note"><span class="tag">示意 mock</span>本頁全部是程式產生的原創繪圖資產（SVG 路徑＋種子程序紋理），<b>不是引擎資料</b>，不讀任何存檔或重播。螞蟻放大顯示；顏色與比例的依據見 docs/game-art-style.md。</p>
</header>
<main id="main"></main>
<script type="module" src="dist/prototypes/art-preview/preview.js"></script>
</body>
</html>
