<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>繪圖效能測試（非正式）</title>
<style>
  :root { --ground:#e9e2cf; --ink:#2f2a22; --panel:#f7f3ea; --warn:#8a1c1c; }
  html, body { margin:0; height:100%; background:var(--ground); color:var(--ink); font-family:system-ui, sans-serif; overflow:hidden; }
  #banner { position:fixed; top:0; left:0; right:0; z-index:10; background:var(--warn); color:#fff; padding:6px 16px; font-size:14px; font-weight:bold; }
  #controls { position:fixed; top:34px; left:0; right:0; z-index:10; background:var(--panel); padding:6px 16px; font-size:13px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #stage { position:fixed; left:0; right:0; top:72px; bottom:0; }
  #stage canvas { display:block; width:100%; height:100%; }
  #hud { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="banner">效能測試用繪圖精靈，不是螞蟻，也不是模擬資料（合成、確定性路徑；非正式，與任何存檔無關）</div>
<div id="controls">
  <label>繪圖器 <select id="renderer"><option value="canvas">Canvas 2D</option><option value="pixi">PixiJS（Sprite）</option></select></label>
  <label>精靈數 <select id="n"><option>100</option><option>1000</option><option>10000</option></select></label>
  <span id="hud"></span>
</div>
<div id="stage"></div>
<script src="bench.js"></script>
</body>
</html>
