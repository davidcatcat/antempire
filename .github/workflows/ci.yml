name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · golden · naturalism · saves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version
      - run: npm ci
      - name: Type check (whole repo + engine without DOM/Node libs)
        run: npm run typecheck
      - name: Golden test (current-rules reports byte-identical + 28 Day14 full-output traces + 24 Day0 traces)
        run: npm run test:golden
      - name: Naturalism (no-god-mode checks; 216 under v2-review.20 to v2-review.31)
        run: npm run test:naturalism
      - name: Save conservation (saves/main.json + saves/world-state.json)
        run: npm run check:saves
      - name: All other tests (params split, platform purity, foraging physics, migration, local ecology incl. orphan queen, scaling, multi-colony, v6 isolation proof vs sim/, advance on a temp copy, nest temperature, save transaction fault injection, Day1-14 history integrity, cumulative save counters, rules isolation, simultaneous hunting, injury types, crop ledger, individual route memory, rules registry and safe rules upgrade, multi-colony timeline prototype evidence, Day0 initialization and Day0->Day1 / 90-day audits, death diagnostics, individual activity timeline audit, evaluation-method checks, phase 2 sensitivity data validation + fixed-seed reruns)
        run: npm run test:rest

  viewer-smoke:
    name: viewer browser tests + preview artifact (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright 1.63.0 and Chromium (not saved to package.json; browser tests only)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Build the viewer (web/dist is a build product, never committed)
        run: npm run web:build
      - name: Start the static server
        run: |
          node cli/web-serve.ts 8781 &
          for i in $(seq 1 30); do curl -sf http://localhost:8781/ > /dev/null && break; sleep 1; done
      - name: Smoke test (desktop + phone; interpolation label, day crossing, deaths, eclosions, replay end, official/experiment separation)
        run: |
          mkdir -p "$RUNNER_TEMP/viewer-shots"
          set -o pipefail
          node tests/browser/web-viewer.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/web-viewer-results.json"
      - name: V3 follow camera + event jump E2E (desktop 1280x800 mouse; Android Pixel 7 profile, touch)
        run: node tests/browser/web-follow.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: V4 daily ecology charts + derived walking speed E2E (desktop; Android Pixel 7 profile, touch)
        run: node tests/browser/web-stats.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: V5 event filter, event map, recorded routes, nest highlights, daily flows, world mark E2E + feature screenshots (desktop 1280x800; Pixel-like phone 412x915 touch; DPR 2)
        run: node tests/browser/web-v5.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: V6 game view E2E + frame-rate measurement (desktop 1280x800; Android Pixel 7 touch; Android with 4x CPU throttling)
        run: node tests/browser/web-game.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: Experiment Worker runtime (P0-A2 PR 2; Node vs Chromium Worker, replay, snapshot/restore, pacing, demo page; non-official)
        run: node tests/browser/worker-runtime.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: V6 replay navigation E2E (next-activity jump, walk marks, day-summary mode; desktop 1280x800; 400px phone touch)
        run: node tests/browser/web-replay-ux.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: SAVE-1 experiment-world save store in Chromium (synthetic payloads; atomicity, recovery, kill, locks, isolation, browser restart, migrations, export/import, save cost)
        run: node tests/browser/save-store.check.cjs "$RUNNER_TEMP/viewer-shots"
      - name: Assemble the static preview (page + compiled script + data + screenshots + test results + instructions)
        if: always()
        run: |
          P="$RUNNER_TEMP/antempire-viewer-preview"
          mkdir -p "$P/site" "$P/screenshots" "$P/test-results"
          cp web/index.html web/analysis.html "$P/site/" && cp -r web/dist web/data "$P/site/"
          cp web/PREVIEW.md "$P/README.md"
          cp "$RUNNER_TEMP"/viewer-shots/*.png "$P/screenshots/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/viewer-shots/*.json "$P/test-results/" 2>/dev/null || true
          node tests/web-v3-follow.test.ts > "$P/test-results/web-v3-follow-node.json" 2>&1 || true
          node tests/web-v4-stats.test.ts > "$P/test-results/web-v4-stats-node.json" 2>&1 || true
          node tests/web-v5-observer.test.ts > "$P/test-results/web-v5-observer-node.json" 2>&1 || true
          cp docs/viewer-v5.md "$P/" 2>/dev/null || true
          node tests/web-v6-game.test.ts > "$P/test-results/web-v6-game-node.json" 2>&1 || true
          node tests/web-v6-replay-ux.test.ts > "$P/test-results/web-v6-replay-ux-node.json" 2>&1 || true
          cp docs/viewer-v6-game.md "$P/" 2>/dev/null || true
          echo "commit ${GITHUB_SHA}" > "$P/BUILD.txt"; date -u >> "$P/BUILD.txt"; ls -R "$P" | head -60
      - name: Upload screenshots
        if: always()
        # Uploading is not a test: every check above already failed or passed the job.
        # A full Actions artifact storage quota must not turn a green test run red (2026-11-12).
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: viewer-screenshots
          retention-days: 7
          path: ${{ runner.temp }}/viewer-shots
      - name: Upload the static preview (open site/index.html through any static server; see README.md)
        if: always()
        # Uploading is not a test: every check above already failed or passed the job.
        # A full Actions artifact storage quota must not turn a green test run red (2026-11-12).
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: antempire-viewer-preview
          retention-days: 7
          path: ${{ runner.temp }}/antempire-viewer-preview
