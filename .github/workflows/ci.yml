name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · golden · naturalism · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version
      - run: npm ci
      - name: Type check (whole repo + engine without DOM/Node libs)
        run: npm run typecheck
      - name: Golden test (current-rules reports byte-identical + 28 full-output traces from the retired legacy Day14 fixture + 24 Day0 traces)
        run: npm run test:golden
      - name: Naturalism (no-god-mode checks; 216 under v2-review.20 to v2-review.31)
        run: npm run test:naturalism

  tests:
    # The remaining BLOCKING tests, split into parallel shards (tests/run-all.ts --shard k/n).
    # The shards are a proven partition (tests/run-all-shards.test.ts): every test runs exactly once.
    name: tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: BLOCKING tests except golden/naturalism (shard ${{ matrix.shard }} of 3)
        run: node tests/run-all.ts --except golden,naturalism --shard ${{ matrix.shard }}/3

  # The two opt-in Demo 2 paths run in their own job: together with the viewer job's other browser checks they exceeded
  # that job's 25-minute limit on a slow runner (2026-11-15). Same setup; own static server and artifact.
  demo2-optional:
    name: Demo 2 opt-in renderer and picture style (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright 1.63.0 and Chromium (not saved to package.json; browser tests only)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Build the viewer (web/dist is a build product, never committed)
        run: npm run web:build
      - name: Start the static server
        run: |
          mkdir -p "$RUNNER_TEMP/demo2-shots"
          node cli/web-serve.ts 8782 &
          for i in $(seq 1 30); do curl -sf http://localhost:8782/ > /dev/null && break; sleep 1; done
      - name: Demo 2 opt-in WebGPU renderer (default stays WebGL 2; fallback message without WebGPU; node-material path on three's WebGL 2 backend with a pixel comparison of the two rigs; a REAL WebGPU backend on a software adapter drawn offscreen and read back when Chromium provides one - reported as skipped, not passed, when it does not; identical display-director output under every renderer; non-official)
        run: |
          set -o pipefail
          node tests/browser/demo2-webgpu.check.cjs "$RUNNER_TEMP/demo2-shots" http://localhost:8782/ | tee "$RUNNER_TEMP/demo2-shots/demo2-webgpu-results.json"
      - name: Demo 2 opt-in HD-2D picture style (display only, WebGL 2 only; toggle and pixel factors, really pixelated picture with native-resolution labels, same individuals and identical display-director output with the style on or off, selection and follow with pixelation, light shafts follow the engine light state, auto quality drops depth of field then bloom, refused with a message under the WebGPU renderer path; desktop 1440x900 + Pixel 7; non-official)
        run: |
          set -o pipefail
          node tests/browser/demo2-hd2d.check.cjs "$RUNNER_TEMP/demo2-shots" http://localhost:8782/ | tee "$RUNNER_TEMP/demo2-shots/demo2-hd2d-results.json"
      - name: Demo 2 performance test smoke (30 individuals, 1 s warm-up + 2 s - render-only with synthetic data and no Worker, full simulation with engine workers; the result must be classified software and labelled as not a device result; not a performance gate)
        run: |
          set -o pipefail
          node tests/browser/demo2-bench.run.cjs "$RUNNER_TEMP/demo2-shots/demo2-bench-smoke.json" http://localhost:8782/ --smoke
      - name: Upload screenshots and results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: demo2-optional-screenshots
          retention-days: 7
          path: ${{ runner.temp }}/demo2-shots

  viewer-smoke:
    name: viewer browser tests + preview artifact (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright 1.63.0 and Chromium (not saved to package.json; browser tests only)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Build the viewer (web/dist is a build product, never committed)
        run: npm run web:build
      - name: Start the static server
        run: |
          node cli/web-serve.ts 8781 &
          for i in $(seq 1 30); do curl -sf http://localhost:8781/ > /dev/null && break; sleep 1; done
      - name: Smoke test (desktop + phone; interpolation label, day crossing, deaths, eclosions, replay end, no official world / experiment label)
        run: |
          mkdir -p "$RUNNER_TEMP/viewer-shots"
          set -o pipefail
          node tests/browser/web-viewer.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/web-viewer-results.json"
      - name: V3 follow camera + event jump E2E (desktop 1280x800 mouse; Android Pixel 7 profile, touch)
        run: node tests/browser/web-follow.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: V4 daily ecology charts + derived walking speed E2E (desktop; Android Pixel 7 profile, touch)
        run: node tests/browser/web-stats.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: V5 event filter, event map, recorded routes, nest highlights, daily flows, world mark E2E + feature screenshots (desktop 1280x800; Pixel-like phone 412x915 touch; DPR 2)
        run: node tests/browser/web-v5.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: V6 game view E2E + frame-rate measurement (desktop 1280x800; Android Pixel 7 touch; Android with 4x CPU throttling)
        run: node tests/browser/web-game.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: Experiment Worker runtime (P0-A2 PR 2; Node vs Chromium Worker, replay, snapshot/restore, pacing, demo page; non-official)
        run: node tests/browser/worker-runtime.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: Deterministic exp / log / pow / sin sweep (rules update detmath-exp; Node vs Chromium page vs Chromium module Worker, bit for bit, no tolerance)
        run: node tests/browser/detmath-xenv.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: V6 replay navigation E2E (next-activity jump, walk marks, day-summary mode; desktop 1280x800; 400px phone touch)
        run: node tests/browser/web-replay-ux.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/
      - name: SAVE-1 experiment-world save store in Chromium (synthetic payloads; atomicity, recovery, kill, locks, isolation, browser restart, migrations, export/import, save cost)
        run: node tests/browser/save-store.check.cjs "$RUNNER_TEMP/viewer-shots"
      - name: V6-2 experiment mode (P0-A2 PR 3; Worker + layered renderer; drawn = engine at record instants, UI ops do not change results, official/experiment isolation, headless measurements; desktop + Pixel 7)
        run: |
          set -o pipefail
          node tests/browser/v62-experiment.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/v62-experiment-results.json"
      - name: VIS-1 garden view (P0-A2; display paths = engine at record instants, close-up, underground concept label, legend, UI ops do not change results; desktop 1440x900 + Pixel 7; screenshots + short video)
        run: |
          set -o pipefail
          node tests/browser/vis1-demo.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/vis1-demo-results.json"
      - name: SAVE-2 menu, autosave and resume acceptance (real Chromium, persistent profiles; Owner flow 1-10, tests A-E, hard kill, multi-tab, rules mismatch, import as copy; browser-advanced P0-A2 save -> node cli/verify-save.ts -> node_verified; desktop + Pixel 7 screens)
        run: |
          set -o pipefail
          node tests/browser/save2-acceptance.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/save2-acceptance-results.json"
      - name: SAVE-2 acceptance with the synthetic test world (SAVE2_WORLD=synthetic; same Owner flow 1-10 and tests A-E on the other world kind, about 2 min; non-official)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/viewer-shots/save2-synthetic"
          SAVE2_WORLD=synthetic node tests/browser/save2-acceptance.check.cjs "$RUNNER_TEMP/viewer-shots/save2-synthetic" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/save2-acceptance-synthetic-results.json"
      - name: SAVE-2 both world kinds in one profile (session list race regression; a reopened page lists saved synthetic and P0-A2 worlds as compatible, 繼續遊戲 enabled, both open; non-official)
        run: |
          set -o pipefail
          node tests/browser/save2-world-kinds.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/save2-world-kinds-results.json"
      - name: Worker failure does not hang the menu (issue #224; Worker script 404 and terminate while playing; saves stay listed and exportable; non-official)
        run: |
          set -o pipefail
          node tests/browser/worker-fatal.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/worker-fatal-results.json"
      - name: Three.js 3D prototype (#256/#258; P0-A2 experiment world via worker-client, 30 ants, follow, gait phase from drawn distance, uTime frozen when paused, labels, no phone horizontal scroll; desktop 1280x800 + Pixel 7; non-official)
        run: |
          set -o pipefail
          node tests/browser/three-demo.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/three-demo-results.json"
      - name: Demo 2 (surface + nest cross-section in one world; P0-A2 experiment world via worker-client; 30 engine workers on the surface and underground, natural vs labelled demo-scenario mode, views, tap select, follow, one worker through a full trip with step_until - same id, continuous drawn point, never inside the soil; pause freezes; save -> reload -> continue; desktop 1440x900 + Pixel 7; non-official)
        run: |
          set -o pipefail
          node tests/browser/demo2.check.cjs "$RUNNER_TEMP/viewer-shots" http://localhost:8781/ | tee "$RUNNER_TEMP/viewer-shots/demo2-results.json"
      - name: Assemble the static preview (page + compiled script + data + screenshots + test results + instructions)
        if: always()
        run: |
          P="$RUNNER_TEMP/antempire-viewer-preview"
          mkdir -p "$P/site" "$P/screenshots" "$P/test-results"
          cp web/index.html web/analysis.html "$P/site/" && cp -r web/dist web/data "$P/site/"
          # experiment Worker build + the 3D prototype page and its vendored three (built by npm run web:build above)
          # Demo 2 (web/demo2.html) needs the same vendor directory: vendor/three and vendor/demo2/nest-layout.json
          cp web/experiment.html web/three.html web/demo2.html web/demo2-bench.html "$P/site/" && cp -r web/worker-dist web/vendor "$P/site/"
          cp "$RUNNER_TEMP"/viewer-shots/three-*.jpg "$RUNNER_TEMP"/viewer-shots/demo2-*.jpg "$P/screenshots/" 2>/dev/null || true
          cp docs/demo2.md "$P/" 2>/dev/null || true
          cp web/PREVIEW.md "$P/README.md"
          cp "$RUNNER_TEMP"/viewer-shots/*.png "$P/screenshots/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/viewer-shots/*.json "$P/test-results/" 2>/dev/null || true
          node tests/web-v3-follow.test.ts > "$P/test-results/web-v3-follow-node.json" 2>&1 || true
          node tests/web-v4-stats.test.ts > "$P/test-results/web-v4-stats-node.json" 2>&1 || true
          node tests/web-v5-observer.test.ts > "$P/test-results/web-v5-observer-node.json" 2>&1 || true
          cp docs/viewer-v5.md "$P/" 2>/dev/null || true
          node tests/web-v6-game.test.ts > "$P/test-results/web-v6-game-node.json" 2>&1 || true
          node tests/web-v6-replay-ux.test.ts > "$P/test-results/web-v6-replay-ux-node.json" 2>&1 || true
          cp docs/viewer-v6-game.md "$P/" 2>/dev/null || true
          echo "commit ${GITHUB_SHA}" > "$P/BUILD.txt"; date -u >> "$P/BUILD.txt"; ls -R "$P" | head -60
      - name: Upload screenshots
        if: always()
        # Uploading is not a test: every check above already failed or passed the job.
        # A full Actions artifact storage quota must not turn a green test run red (2026-11-12).
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: viewer-screenshots
          retention-days: 7
          path: ${{ runner.temp }}/viewer-shots
      - name: Upload the static preview (open site/index.html through any static server; see README.md)
        if: always()
        # Uploading is not a test: every check above already failed or passed the job.
        # A full Actions artifact storage quota must not turn a green test run red (2026-11-12).
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: antempire-viewer-preview
          retention-days: 7
          path: ${{ runner.temp }}/antempire-viewer-preview
