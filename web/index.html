<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>螞蟻帝國 觀察器</title>
<style>
  /* 觀察箱：土色地面、墨色文字；畫布顏色也讀這些 token */
  :root { --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --ground: #e6dcc3; --ink: #2b261d; --panel: #f7f3ea; --line: #d6cbb2; --muted: #857a63; --link: #b3a688; --ant: #1b1a17; --select: #c0392b; --trail: 196,76,32; --explored: 46,125,90; --official-bg: #e2eaf3; --official-fg: #1d3b5c; --exp-bg: #f6e3d1; --exp-fg: #6b3410; --place-nest: #6d4c2f; --place-honeydew: #4f8f3c; --place-nectar: #c9941c; --place-carcass: #8b5a3c; --place-other: #9a917d; --task-forage: #c0392b; --task-nurse: #2f6db3; --task-rest: #8c8270; --task-repair: #7a5a1e; --task-guard: #6b3fa0; --route: #1f5fbf; --cat-forage: #b07d10; --cat-social: #2f6db3; --cat-explore: #13817f; --cat-hunt: #a33a2a; --cat-death: #1b1a17; --cat-brood: #8e4fa3; --cat-care: #c2577f; --cat-ecology: #4f8f3c; --cat-other: #8c8270; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --ground: #2a251d; --ink: #ece4d2; --panel: #1c1914; --line: #463e31; --muted: #a89c84; --link: #6f6553; --ant: #f2ead8; --select: #ff7a66; --trail: 236,120,72; --explored: 104,190,150; --official-bg: #1f2b38; --official-fg: #c9dcf0; --exp-bg: #3a2717; --exp-fg: #f2c9a4; --place-nest: #b98a5e; --place-honeydew: #7cc46a; --place-nectar: #f0c25a; --place-carcass: #c98e6a; --place-other: #b7ad98; --task-forage: #ff7a66; --task-nurse: #79aef0; --task-rest: #b0a58f; --task-repair: #d9b26a; --task-guard: #c39bf0; --route: #8fc1ff; --cat-forage: #f0c25a; --cat-social: #79aef0; --cat-explore: #5fd1c9; --cat-hunt: #ff8a73; --cat-death: #f2ead8; --cat-brood: #cf9be0; --cat-care: #f19bbd; --cat-ecology: #7cc46a; --cat-other: #b0a58f; color-scheme: dark; } }
  :root[data-theme="dark"] { --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --ground: #2a251d; --ink: #ece4d2; --panel: #1c1914; --line: #463e31; --muted: #a89c84; --link: #6f6553; --ant: #f2ead8; --select: #ff7a66; --trail: 236,120,72; --explored: 104,190,150; --official-bg: #1f2b38; --official-fg: #c9dcf0; --exp-bg: #3a2717; --exp-fg: #f2c9a4; --place-nest: #b98a5e; --place-honeydew: #7cc46a; --place-nectar: #f0c25a; --place-carcass: #c98e6a; --place-other: #b7ad98; --task-forage: #ff7a66; --task-nurse: #79aef0; --task-rest: #b0a58f; --task-repair: #d9b26a; --task-guard: #c39bf0; --route: #8fc1ff; --cat-forage: #f0c25a; --cat-social: #79aef0; --cat-explore: #5fd1c9; --cat-hunt: #ff8a73; --cat-death: #f2ead8; --cat-brood: #cf9be0; --cat-care: #f19bbd; --cat-ecology: #7cc46a; --cat-other: #b0a58f; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; color: var(--ink); background: var(--panel); }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  select, button, input[type=range] { font-size: 14px; }
  .badge { width: 100%; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  .badge.official { background: var(--official-bg); color: var(--official-fg); }
  .badge.experiment { background: var(--exp-bg); color: var(--exp-fg); }
  main { display: grid; grid-template-columns: 1fr; }
  #mapwrap { position: relative; height: 58vh; min-height: 300px; background: var(--ground); touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #weather { position: absolute; top: 8px; right: 8px; background: var(--panel); color: var(--ink); opacity: 0.92; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
  #timeline { padding: 8px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  #timeline .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #timeline input[type=range] { flex: 1; min-width: 160px; }
  aside { padding: 8px 12px; display: grid; gap: 10px; }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  section h2 { font-size: 14px; margin: 0 0 6px; }
  #info h3 { margin: 0 0 4px; }
  #info p, #nest { margin: 4px 0; font-size: 13px; line-height: 1.5; }
  #events { max-height: 260px; overflow: auto; font-size: 12px; line-height: 1.5; display: grid; gap: 2px; margin-top: 4px; }
  #events button.ev { all: unset; cursor: pointer; padding: 3px 4px; border-radius: 4px; display: block; }
  #events button.ev:hover, #events button.ev:focus-visible { background: var(--line); outline: none; }
  #events button.ev.future { color: var(--muted); }
  #events button.ev.current { background: var(--exp-bg); color: var(--exp-fg); }
  .followbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .followbar button, .jump button { min-height: 32px; padding: 0 10px; }
  .jump { font-size: 12px; line-height: 1.6; padding: 6px 8px; border-radius: 6px; background: var(--exp-bg); color: var(--exp-fg); display: grid; gap: 4px; }
  .jump .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  /* V4 daily ecology charts (small multiples; one y-axis per chart) */
  #stats, #flows { display: grid; gap: 10px; }
  :is(#stats, #flows) figure { margin: 0; }
  :is(#stats, #flows) figcaption { font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  :is(#stats, #flows) svg { width: 100%; height: auto; display: block; touch-action: pan-y; cursor: pointer; }
  :is(#stats, #flows) .grid { stroke: var(--line); stroke-width: 1; }
  :is(#stats, #flows) .tick { fill: var(--muted); font-size: 9px; }
  :is(#stats, #flows) .dlabel { fill: var(--ink); font-size: 9px; }
  :is(#stats, #flows) polyline { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  :is(#stats, #flows) polyline.s1, .sw.s1 { stroke: var(--series-1); background: var(--series-1); }
  :is(#stats, #flows) polyline.s2, .sw.s2 { stroke: var(--series-2); background: var(--series-2); }
  :is(#stats, #flows) polyline.s3, .sw.s3 { stroke: var(--series-3); background: var(--series-3); }
  :is(#stats, #flows) rect.s1 { fill: var(--series-1); } :is(#stats, #flows) rect.s2 { fill: var(--series-2); } :is(#stats, #flows) rect.s3 { fill: var(--series-3); }
  :is(#stats, #flows) .now { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; }
  :is(#stats, #flows) .hit { fill: transparent; }
  :is(#stats, #flows) .legend-row { display: inline-flex; gap: 8px; }
  :is(#stats, #flows) .legend-row .sw { width: 10px; height: 3px; border-radius: 2px; margin-right: 3px; }
  :is(#stats, #flows) .readout { font-size: 11px; color: var(--muted); min-height: 1.4em; }
  .tablewrap { overflow-x: auto; max-height: 320px; }
  .tablewrap table { border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  .tablewrap th, .tablewrap td { padding: 2px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .statsbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .statsbar button[aria-pressed="true"] { font-weight: bold; }
  .note { color: var(--muted); font-size: 12px; }
  .tag { margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: var(--line); color: var(--ink); font-size: 11px; }
  .legend { display: grid; gap: 4px; font-size: 12px; }
  .legend .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }
  .bar { display: inline-block; height: 0; vertical-align: middle; margin-right: 4px; width: 22px; border-top-style: solid; }
  .overlays label { margin-right: 10px; font-size: 13px; white-space: nowrap; }
  /* V5: event filter chips, recorded route table, nest-view highlights */
  .chips5 { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .chips5 button { font-size: 12px; min-height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); }
  .chips5 button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .chips5 button .sw { width: 9px; height: 9px; }
  .chips5 button[aria-pressed="true"] .sw { outline: 1px solid var(--panel); }
  .jump[hidden] { display: none; }
  .chips5 button:disabled { opacity: 0.45; }
  .evbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; }
  #events button.ev .d { color: var(--muted); margin-right: 4px; }
  #route table { border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; width: 100%; }
  #route th, #route td { padding: 2px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  #route th:first-child, #route td:first-child { text-align: left; }
  #route tr.future td { color: var(--muted); }
  #route tr.now td { background: var(--exp-bg); color: var(--exp-fg); }
  #route p { margin: 4px 0; font-size: 12px; line-height: 1.5; }
  #route .tablewrap { max-height: 220px; }
  #placeEvents { font-size: 12px; line-height: 1.5; }
  /* phone: the map and the time controls stay on screen while the panels below scroll (follow + play stay visible) */
  @media (max-width: 899px) { aside section, aside figure { scroll-margin-top: calc(42vh + 150px); } #stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); box-shadow: 0 2px 6px rgba(0,0,0,0.15); } #mapwrap { height: 42vh; min-height: 240px; } #timeline { padding-block: 6px; } }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 380px; } #mapwrap { height: calc(100vh - 170px); } aside { grid-row: span 2; max-height: calc(100vh - 110px); overflow: auto; } }
</style>
</head>
<body>
<header>
  <h1>螞蟻帝國 觀察器</h1>
  <select id="mode" aria-label="世界"></select>
  <select id="view" aria-label="視角"><option value="garden">花園地表</option><option value="nest">巢內</option></select>
  <span class="overlays"><label><input type="checkbox" id="ovTrail" checked>費洛蒙</label><label><input type="checkbox" id="ovExplored">已探索路段</label><label><input type="checkbox" id="ovFood" checked>食物存量</label><label><input type="checkbox" id="ovLabels" checked>地名</label><label><input type="checkbox" id="ovTask">依當日任務摘要上色</label><label><input type="checkbox" id="ovEvents" checked>事件位置</label><label><input type="checkbox" id="ovRoute" checked>所選個體路線</label></span>
  <div id="badge" class="badge">載入中…</div>
</header>
<main>
  <div id="stage">
    <div id="mapwrap"><canvas id="map"></canvas><div id="weather"></div></div>
    <div id="timeline" hidden>
      <div class="row"><label for="day">日</label><input type="range" id="day" min="1" max="1" step="1" value="1"></div>
      <div class="row"><label for="minute">分鐘</label><input type="range" id="minute" min="0" max="360" step="any" value="0"><button id="play">播放</button>
        <select id="speed" aria-label="速度"><option value="1">1 分／秒</option><option value="5">5 分／秒</option><option value="20" selected>20 分／秒</option><option value="60">60 分／秒</option></select></div>
      <div id="timeLabel" class="note"></div>
    </div>
  </div>
  <aside>
    <section><h2>圖例</h2><div id="legend" class="legend"></div></section>
    <section><h2>個體</h2><div class="followbar"><select id="who" aria-label="選擇個體"></select><button id="follow" type="button" disabled>追蹤個體</button><span id="followMsg" class="note" aria-live="polite"></span></div><div id="info"></div></section>
    <section><h2>所選個體的紀錄路線（今日）</h2><div id="route"><p class="note">選取一隻工蟻後顯示。</p></div></section>
    <section><h2>蟻群</h2><div id="nest"></div></section>
    <section><h2>生態統計（引擎每日紀錄）</h2><div class="statsbar"><button id="statsChart" type="button" aria-pressed="true">圖表</button><button id="statsTable" type="button" aria-pressed="false">表格</button><span class="note">點圖表可跳到那一天；虛線＝目前地圖上的日子</span></div><div id="stats"></div></section>
    <section><h2>每日事件數與花園生物（引擎每日紀錄）</h2><div class="statsbar"><button id="flowsChart" type="button" aria-pressed="true">圖表</button><button id="flowsTable" type="button" aria-pressed="false">表格</button><span class="note">點圖表可跳到那一天</span></div><div id="flows"></div></section>
    <section id="evsec"><h2>事件時間軸（引擎紀錄，點選跳轉）</h2><div id="jump" class="jump" hidden></div><div class="evbar"><label for="evScope">範圍</label><select id="evScope"><option value="day">當日</option><option value="all">全部日子</option></select><label class="note"><input type="checkbox" id="evMine">只看所選個體</label><span id="evCount" class="note" aria-live="polite"></span></div><div id="evCats" class="chips5" role="group" aria-label="事件類別篩選"></div><div id="events"></div><div id="placeEvents"></div></section>
    <section class="note">觀察者視角：玩家可看到全地圖、費洛蒙與統計；螞蟻自己只知道親身感知與記憶的資訊。地圖座標由「方位＋約距離」推得，非測量。兩個紀錄點之間的移動是畫面插值，不是模擬事件。</section>
  </aside>
</main>
<script type="module" src="dist/main.js"></script>
</body>
</html>
