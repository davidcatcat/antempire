<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>螞蟻帝國</title>
<style>
  /* Game View: one fixed natural look (soil scene); every control sets its own colours so either host theme reads */
  :root { --bar: rgba(28,22,15,0.82); --bar-ink: #f3ead6; --muted: #cbbd9f; --accent: #e9b949; --line: rgba(243,234,214,0.25); --exp-bg: #f6e3d1; --exp-fg: #6b3410; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #6e5338; color: var(--bar-ink); font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; cursor: grab; }
  .bar { position: fixed; left: 0; right: 0; background: var(--bar); color: var(--bar-ink); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); backdrop-filter: blur(3px); z-index: 2; }
  #top { top: 0; padding-block: calc(6px + env(safe-area-inset-top, 0px)) 6px; }
  #bottom { bottom: 0; padding-block: 6px calc(8px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 16px; margin: 0; letter-spacing: 0.05em; }
  select, button, a.btn { font: inherit; font-size: 14px; min-height: 34px; color: var(--bar-ink); background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
  button:disabled { opacity: 0.4; }
  button.primary { background: var(--accent); color: #2a1d0b; border-color: var(--accent); font-weight: 600; min-width: 72px; }
  option { color: #1d160e; }
  a { color: var(--accent); }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  label { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  #badge { flex-basis: 100%; font-size: 12px; color: var(--exp-fg); background: var(--exp-bg); border-radius: 6px; padding: 3px 8px; }
  #clock { flex: 1 1 200px; min-width: 140px; accent-color: var(--accent); }
  #time { font-size: 13px; font-variant-numeric: tabular-nums; flex-basis: 100%; }
  .chip { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); background: var(--bar); border-radius: 8px; padding: 4px 8px; font-size: 12px; z-index: 2; }
  #weather { top: 108px; } #counts { top: 136px; }
  #card { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); top: 108px; max-width: min(420px, calc(100vw - 20px)); background: var(--bar); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.6; z-index: 3; }
  #card .muted { color: var(--muted); font-size: 12px; }
  #card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  #banner, #toast { position: fixed; left: 50%; transform: translateX(-50%); max-width: min(640px, calc(100vw - 24px)); background: rgba(20,15,10,0.88); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; text-align: center; z-index: 3; }
  #banner { top: 42%; } #toast { top: 30%; font-size: 12px; color: var(--muted); }
  #about { position: fixed; inset: 96px max(10px, env(safe-area-inset-right, 0px)) 120px max(10px, env(safe-area-inset-left, 0px)); max-width: 640px; margin-inline: auto; overflow: auto; background: rgba(24,18,12,0.95); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-size: 13px; line-height: 1.6; z-index: 4; }
  #about h2 { font-size: 15px; margin: 4px 0 6px; }
  #about code { font-size: 12px; overflow-wrap: anywhere; }
  .legend-tag { font-size: 11px; color: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 600px) { h1 { font-size: 15px; } #weather { top: 128px; } #counts { top: 156px; } #card { top: 184px; } #badge { font-size: 11px; } select, button, a.btn { font-size: 13px; min-height: 36px; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="花園中的螞蟻（引擎紀錄重播）"></canvas>
<div id="top" class="bar">
  <h1>螞蟻帝國</h1>
  <select id="world" aria-label="實驗世界"></select>
  <button id="infoBtn" type="button" aria-expanded="false">資料說明</button>
  <a class="btn" href="analysis.html">分析模式</a>
  <div id="badge">載入中…</div>
</div>
<div id="weather" class="chip"></div>
<div id="counts" class="chip"></div>
<div id="card" hidden></div>
<div id="banner" hidden></div>
<div id="toast" hidden></div>
<div id="about" hidden></div>
<div id="bottom" class="bar">
  <button id="play" class="primary" type="button" aria-pressed="true">暫停</button>
  <button id="prevDay" type="button" aria-label="前一日">◀ 日</button>
  <button id="nextDay" type="button" aria-label="後一日">日 ▶</button>
  <select id="speed" aria-label="播放速度"></select>
  <label><input type="checkbox" id="skip" checked>快轉無人行走的時段</label>
  <label><input type="checkbox" id="labels">標籤</label>
  <button id="fit" type="button">全景</button>
  <input type="range" id="clock" min="0" max="360" step="any" value="0" aria-label="活動時段內的時間（分鐘）">
  <div id="time" aria-live="off"></div>
  <span class="legend-tag">位置＝引擎紀錄點與其間的顯示插值；場景為示意；螞蟻放大顯示</span>
</div>
<script type="module" src="dist/game.js"></script>
</body>
</html>
