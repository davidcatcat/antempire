<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>螞蟻帝國</title>
<style>
  /* Game View: the garden fills the screen; a minimal translucent HUD; analysis aids are optional layers */
  :root { --bar: rgba(22,16,10,0.55); --panel: rgba(24,18,12,0.9); --bar-ink: #f3ead6; --muted: #cbbd9f; --accent: #e9b949; --line: rgba(243,234,214,0.22); --exp-bg: rgba(246,227,209,0.92); --exp-fg: #6b3410; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #3d2c1d; color: var(--bar-ink); font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; cursor: grab; }
  .bar { position: fixed; left: 0; right: 0; background: var(--bar); color: var(--bar-ink); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); backdrop-filter: blur(4px); z-index: 2; }
  #top { top: 0; padding-block: calc(4px + env(safe-area-inset-top, 0px)) 4px; background: linear-gradient(rgba(22,16,10,0.62), rgba(22,16,10,0.38)); }
  #bottom { bottom: 0; padding-block: 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(rgba(22,16,10,0.38), rgba(22,16,10,0.66)); }
  h1 { font-size: 15px; margin: 0 4px 0 0; letter-spacing: 0.05em; }
  select, button, a.btn { font: inherit; font-size: 13px; min-height: 32px; color: var(--bar-ink); background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 8px; padding: 0 9px; }
  button:disabled { opacity: 0.4; }
  button.primary { background: var(--accent); color: #2a1d0b; border-color: var(--accent); font-weight: 600; min-width: 64px; }
  option { color: #1d160e; }
  a { color: var(--accent); }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  label { font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  #badge { font-size: 11px; color: var(--exp-fg); background: var(--exp-bg); border-radius: 6px; padding: 2px 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 260px; }
  #timeline { flex: 1 1 100%; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  #clock { width: 100%; min-width: 0; margin: 0; accent-color: var(--accent); }
  /* walk marks: one per engine-recorded walk interval; a minimum drawn width keeps very short walks visible (drawing only) */
  #marks { position: relative; height: 14px; border-radius: 4px; background: rgba(255,255,255,0.07); border: 1px solid var(--line); touch-action: none; cursor: pointer; overflow: hidden; }
  #marks i { position: absolute; top: 2px; bottom: 2px; min-width: 2px; background: rgba(233,185,73,0.55); border-radius: 1px; pointer-events: none; }
  .marks-legend { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .marks-legend b { flex: none; display: inline-block; width: 14px; height: 8px; background: rgba(233,185,73,0.75); border-radius: 1px; }
  button.touch { min-height: 44px; min-width: 44px; }
  #summary { position: fixed; inset: 84px max(10px, env(safe-area-inset-right, 0px)) 92px max(10px, env(safe-area-inset-left, 0px)); max-width: 720px; margin-inline: auto; overflow: auto; background: rgba(24,18,12,0.96); border: 2px solid var(--accent); border-radius: 12px; padding: 10px 16px; font-size: 13px; line-height: 1.6; z-index: 3; }
  #summary .sum-label { display: inline-block; font-size: 16px; font-weight: 700; color: #2a1d0b; background: var(--accent); border-radius: 6px; padding: 2px 10px; }
  #summary h2 { font-size: 15px; margin: 8px 0 4px; } #summary h3 { font-size: 14px; margin: 10px 0 4px; }
  #summary table { border-collapse: collapse; width: 100%; font-size: 12px; } #summary th, #summary td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
  #summary details { margin: 2px 0; } #summary summary { cursor: pointer; min-height: 32px; display: list-item; } #summary ul { margin: 2px 0 6px; padding-left: 18px; overflow-wrap: anywhere; }
  #summary .muted { color: var(--muted); }
  body.summary-mode #scene { visibility: hidden; }
  body.summary-mode .play-only, body.summary-mode #banner, body.summary-mode #toast, body.summary-mode #jumpHint, body.summary-mode #weather, body.summary-mode #counts, body.summary-mode #card { display: none !important; }
  @media (pointer: coarse) { #clock { min-height: 44px; } #marks { height: 22px; } }
  #time { font-size: 12px; font-variant-numeric: tabular-nums; flex-basis: 100%; color: var(--muted); }
  .chip { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); background: var(--panel); border-radius: 8px; padding: 4px 8px; font-size: 12px; z-index: 2; }
  #weather { top: 84px; } #counts { top: 112px; }
  #layers { position: fixed; top: 44px; right: max(10px, env(safe-area-inset-right, 0px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; z-index: 4; font-size: 13px; }
  #layers .legend-tag { max-width: 220px; white-space: normal; }
  #card { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); top: 84px; max-width: min(420px, calc(100vw - 20px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.6; z-index: 3; }
  #card .muted { color: var(--muted); font-size: 12px; }
  #card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  #banner, #toast { position: fixed; left: 50%; transform: translateX(-50%); max-width: min(640px, calc(100vw - 24px)); background: rgba(20,15,10,0.82); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.5; text-align: center; z-index: 3; }
  #banner { top: 42%; } #toast { top: 18%; font-size: 12px; color: var(--muted); }
  #about { position: fixed; inset: 84px max(10px, env(safe-area-inset-right, 0px)) 120px max(10px, env(safe-area-inset-left, 0px)); max-width: 640px; margin-inline: auto; overflow: auto; background: rgba(24,18,12,0.95); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-size: 13px; line-height: 1.6; z-index: 4; }
  #about h2 { font-size: 15px; margin: 4px 0 6px; }
  #about code { font-size: 12px; overflow-wrap: anywhere; }
  .legend-tag { font-size: 11px; color: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 600px) { h1 { font-size: 14px; } #weather { top: 96px; } #counts { top: 124px; } #card { top: 96px; } select, button, a.btn { font-size: 12.5px; min-height: 34px; } #bottom .legend-tag:not(#motionTag) { display: none; } }
  /* Issue #191 Q5 — narrow screens: only play / speed / next activity / day summary / 更多 and the timeline stay in the
     bars (≥ 44 px targets); labels, panorama, home, day stepping, world / layers / info / analysis move into the 更多
     panel (game.ts moves the [data-more] nodes, so their handlers and ids are unchanged). */
  #morePanel { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bar-bottom, 160px) + 6px); max-height: calc(100dvh - var(--bar-bottom, 160px) - var(--bar-top, 40px) - 16px); overflow: auto; background: rgba(24,18,12,0.96); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; z-index: 4; font-size: 13px; }
  #morePanel .more-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
  #moreItems { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #moreItems > button, #moreItems > select, #moreItems > a.btn, #moreItems > label { min-height: 44px; }
  #moreItems > .legend-tag, #moreItems > .marks-legend { flex-basis: 100%; display: flex; }
  #jumpHint { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bar-bottom, 160px) + 6px); max-width: 560px; margin-inline: auto; display: flex; gap: 8px; align-items: center; background: rgba(24,18,12,0.94); border: 1px solid var(--accent); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; line-height: 1.5; z-index: 3; }
  #jumpHint button { flex: none; white-space: nowrap; }
  #toast .jump-label { display: inline-block; color: #2a1d0b; background: var(--accent); border-radius: 5px; padding: 0 6px; margin-right: 6px; font-weight: 700; }
  #summary { top: calc(var(--bar-top, 78px) + 6px); bottom: calc(var(--bar-bottom, 86px) + 6px); }
  #about { top: calc(var(--bar-top, 78px) + 6px); bottom: calc(var(--bar-bottom, 114px) + 6px); } #about .about-close { float: right; }
  #summary .num { font-variant-numeric: tabular-nums; } #summary section.rec table:not(.tasks) td:last-child { text-align: right; } #summary table.tasks td.num { text-align: right; }
  #summary .srcs code, #summary section.rec code { font-size: 11px; overflow-wrap: anywhere; } #summary p.src { margin: 2px 0 2px 14px; }
  @media (min-width: 601px) { #moreBtn { display: none; } }
  @media (max-width: 600px) {
    #top { flex-wrap: nowrap; } #top h1 { flex: none; font-size: 13px; } #badge { flex: 1 1 0; min-width: 0; }
    #bottom { gap: 4px 6px; }
    #bottom .core { min-height: 44px; min-width: 44px; padding: 0 8px; }
    #speed { width: 118px; } .wide-only { display: none; }
    #time { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #motionTag { font-size: 10.5px; }
    body.summary-mode #summary { left: 6px; right: 6px; padding: 8px 10px; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="花園中的螞蟻（引擎紀錄重播）"></canvas>
<div id="top" class="bar">
  <h1>螞蟻帝國</h1>
  <select id="world" aria-label="實驗世界" data-more="always"></select>
  <button id="layersBtn" type="button" aria-expanded="false" data-more="always">圖層</button>
  <button id="infoBtn" type="button" aria-expanded="false" data-more="always">資料說明</button>
  <a class="btn" href="analysis.html" data-more="always">分析模式</a>
  <div id="badge">載入中…</div>
</div>
<div id="layers" hidden>
  <label><input type="checkbox" id="layerEngine">引擎物件標示</label>
  <label><input type="checkbox" id="layerLabels">地點代號</label>
  <label><input type="checkbox" id="layerRoutes">紀錄路段</label>
  <label><input type="checkbox" id="layerIds">螞蟻 ID</label>
  <label><input type="checkbox" id="layerChips">狀態列（氣溫、在外數）</label>
  <span class="legend-tag">這些是玩家視角的輔助圖層，螞蟻不知道這些資訊。</span>
</div>
<div id="weather" class="chip" hidden></div>
<div id="counts" class="chip" hidden></div>
<div id="card" hidden></div>
<div id="banner" hidden></div>
<div id="toast" hidden></div>
<div id="about" hidden></div>
<div id="summary" hidden role="region" aria-label="日摘要（非連續播放）"></div>
<div id="bottom" class="bar">
  <button id="play" class="primary play-only core" type="button" aria-pressed="true">暫停</button>
  <select id="speed" class="play-only core" aria-label="播放速度"></select>
  <button id="nextAct" class="touch play-only core" type="button" title="跳轉（不是連續播放）：第 1 次按停在下一段引擎紀錄的行走開始前約 3 秒，再按到開始那一刻，再按到下一段行走前約 3 秒（快捷鍵 N）" aria-keyshortcuts="N">下一段<span class="wide-only">活動</span> ⏭</button>
  <button id="modeBtn" class="touch core" type="button" aria-pressed="false" title="切換：連續播放／日摘要（非連續播放）（快捷鍵 S）" aria-keyshortcuts="S">日摘要</button>
  <button id="prevDay" type="button" aria-label="前一日" data-more="playback">◀ 日</button>
  <button id="nextDay" type="button" aria-label="後一日" data-more="playback">日 ▶</button>
  <label class="play-only" data-more="always"><input type="checkbox" id="skip" checked>快轉無人行走的時段</label>
  <button id="homeBtn" class="play-only" type="button" data-more="always">巢口近景</button>
  <button id="fit" class="play-only" type="button" data-more="always">全景</button>
  <button id="moreBtn" class="touch core" type="button" aria-expanded="false" aria-controls="morePanel">更多</button>
  <div id="timeline" class="play-only">
    <input type="range" id="clock" min="0" max="360" step="any" value="0" aria-label="活動時段內的時間（分鐘）">
    <div id="marks" role="img" aria-label="引擎紀錄的行走時段"></div>
    <div class="marks-legend" data-more="always"><b></b><span>引擎紀錄的行走時段（worker_activity）；點選或拖曳可跳轉，不改變紀錄</span></div>
  </div>
  <div id="time" class="play-only" aria-live="off"></div>
  <span class="legend-tag play-only" data-more="always">位置＝引擎紀錄點與其間的顯示插值；場景、光源為示意；螞蟻放大顯示</span>
  <span class="legend-tag" id="motionTag">頭與觸角動作＝示意動畫（引擎尚未模擬）</span>
</div>
<div id="morePanel" hidden role="region" aria-label="更多控制（窄螢幕）">
  <div class="more-head"><b>更多</b><span class="legend-tag">標籤、全景、巢口近景與其他控制（快捷鍵：N 下一段活動、S 日摘要）</span></div>
  <div id="moreItems"></div>
</div>
<div id="jumpHint" hidden role="note"><span id="jumpHintText"></span><button id="jumpHintClose" type="button" class="touch">知道了</button></div>
<script type="module" src="dist/game.js"></script>
</body>
</html>
